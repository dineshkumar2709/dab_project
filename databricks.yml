# This is a Declarative Automation Bundle definition for dab_project.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dab_project
  uuid: 532265c3-1ceb-4603-86ca-fb24bc019703

include:
  - resources/*.yml


# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: this is my catalog
    default: bike_dev
  dev_flag:
    default: true

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405616585884033.13.azuredatabricks.net

    variables:
     catalog: bike_dev
     dev_flag: false
    
    presets:
      artifacts_dynamic_version: true
  test:
    mode: production

    workspace:
      host: https://adb-7405618387707909.9.azuredatabricks.net/
      # We explicitly deploy to /Workspace/Users/dkm.done09@hotmail.com to make sure we only have a single copy.
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: bike_test
      dev_flag: false
    permissions:
      - user_name: dkm.done09@hotmail.com
        level: CAN_MANAGE
  prod:
    mode: production
    workspace:
      host: https://adb-7405618400528192.12.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/dkm.done09@hotmail.com to make sure we only have a single copy.
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: bike_prod
      dev_flag: false
    permissions:
      - user_name: dkm.done09@hotmail.com
        level: CAN_MANAGE
