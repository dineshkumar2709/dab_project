on:
  push:
    branches:
      - main
 
 
 
jobs:
  deploy_test:
    name: Deploy to TEST
    runs-on: ubuntu-latest
    environment: test
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}            # <TEST_WORKSPACE_URL>
      DATABRICKS_AUTH_TYPE: azure-client-secret
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}              # <YOUR_TENANT_ID>
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}              # <YOUR_CLIENT_ID>
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}      # <YOUR_CLIENT_SECRET>
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
 
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
 
      - name: Set up uv (builds the wheel)
        uses: astral-sh/setup-uv@v10.2.0
 
      - name: Set up Databricks CLI
        uses: databricks/setup-cli@main
 
      - name: Validate bundle
        run: databricks bundle validate -t test
 
      - name: Deploy bundle
        run: databricks bundle deploy -t test
 
      - name: Run ETL job (smoke test)
        run: databricks bundle run -t test citibike_etl_pipeline_nb
