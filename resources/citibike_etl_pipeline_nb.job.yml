resources:
  jobs:
    citibike_etl_pipeline_nb:
      name: citibike_etl_pipeline_nb
      tasks:
        - task_key: 00_Wheel_creation
          python_wheel_task:
            package_name: dab_project
            entry_point: main
          existing_cluster_id: 0924-223206-q2ui4523
          libraries: 
            - whl: /Workspace/Users/dkm.done09@hotmail.com/dab_project-0.0.2-py3-none-any.whl
        - task_key: 01_bronze
          depends_on:
          - task_key: 00_Wheel_creation
          notebook_task:
            notebook_path: ../bike_etl/notebook/01_bronze/01_bronze_bike.ipynb
            base_parameters:
              pipeline_id: "{{job.id}}"
              run_id: "{{job.run_id}}"
              task_id: "{{task.run_id}}"
              processed_timestamp: "{{job.start_time.iso_datetime}}"
              catalog: "${var.catalog}"
            source: WORKSPACE
          existing_cluster_id: 0924-223206-q2ui4523
        - task_key: 02_silver
          depends_on:
            - task_key: 01_bronze
          notebook_task:
            notebook_path: ../bike_etl/notebook/02_silver/02_silver_bike.ipynb
            base_parameters:
              pipeline_id: "{{job.id}}"
              run_id: "{{job.run_id}}"
              task_id: "{{task.run_id}}"
              processed_timestamp: "{{job.start_time.iso_datetime}}"
              catalog: "${var.catalog}"
            source: WORKSPACE
          existing_cluster_id: 0924-223206-q2ui4523
        - task_key: 03_gold_citibike_daily_ride_summary
          depends_on:
            - task_key: 02_silver
          notebook_task:
            notebook_path: ../bike_etl/notebook/03_gold/03_gold_bike.ipynb
            base_parameters:
              catalog: "${var.catalog}"
            source: WORKSPACE
          existing_cluster_id: 0924-223206-q2ui4523
        - task_key: 03_gold_citibike_daily_station_performance
          depends_on:
            - task_key: 02_silver
          notebook_task:
            notebook_path: ../bike_etl/notebook/03_gold/03_gold_citibike_daily_station_performance.ipynb
            base_parameters:
              catalog: "${var.catalog}"
            source: WORKSPACE
          existing_cluster_id: 0924-223206-q2ui4523
      queue:
        enabled: true
